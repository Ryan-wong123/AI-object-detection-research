<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InlayFake Results</title>
<!--
  Landing page of the repo's GitHub Pages site (served from docs/). Each week's page is a
  self-contained folder docs/results/week<N>_<topic>/, built by its stage with --share in the
  shared site style (src/inlayfake/site.py), and is shown below the tabs:
    week 1: results/week1_real_baseline/   (viewer --share, configs/real_baseline.yaml)
            results/week1_real_baseline/audit.html  (audit --review --share: label audit)
    week 2: results/week2_ai_insertion/    (preview --share, configs/insertion_inphoto.yaml)
  To add a week, add one entry to WEEKS below. The colour tokens are a copy of SITE_CSS.
-->
<style>
:root {
  --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1f24; --muted: #5f6470; --line: #d9dbe0;
  --accent: #2463c2;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171c; --panel: #1e2128; --ink: #e8e9ec; --muted: #a3a8b3; --line: #343842;
    --accent: #5b9bf0;
  }
}
:root[data-theme="dark"] {
  --bg: #15171c; --panel: #1e2128; --ink: #e8e9ec; --muted: #a3a8b3; --line: #343842;
  --accent: #5b9bf0;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  display: flex; flex-direction: column; background: var(--bg); color: var(--ink);
  font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex; align-items: center; gap: 24px; flex-wrap: wrap;
  padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line);
}
h1 { font-size: 17px; font-weight: 650; margin: 0; padding: 12px 0; letter-spacing: .01em; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a {
  display: block; padding: 13px 12px 11px; color: var(--muted); text-decoration: none;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
nav a:hover { color: var(--ink); }
nav a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
nav a small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
.open { margin-left: auto; font-size: 13px; color: var(--muted); }
.open a { color: var(--accent); }
iframe { flex: 1; width: 100%; border: 0; background: var(--bg); }
@media (max-width: 600px) { .open { display: none; } nav a { padding: 10px 8px 8px; } }
</style>
</head>
<body>
<header>
  <h1>InlayFake</h1>
  <nav id="tabs" aria-label="Weeks"></nav>
  <span class="open"><a id="newtab" href="#" target="_blank" rel="noopener">open in a new tab</a></span>
</header>
<iframe id="page" title="Week results"></iframe>
<script>
const WEEKS = [
  { id: "week1", label: "Week 1", sub: "Real-photo baseline",
    src: "results/week1_real_baseline/index.html" },
  { id: "week1-audit", label: "Week 1", sub: "Label audit",
    src: "results/week1_real_baseline/audit.html" },
  { id: "week2", label: "Week 2", sub: "AI insertion",
    src: "results/week2_ai_insertion/index.html" },
];
const nav = document.getElementById("tabs");
const frame = document.getElementById("page");
const newtab = document.getElementById("newtab");
for (const w of WEEKS) {
  const a = document.createElement("a");
  a.href = "#" + w.id;
  a.dataset.id = w.id;
  a.innerHTML = w.label + "<small>" + w.sub + "</small>";
  nav.appendChild(a);
}
function show() {
  const id = location.hash.slice(1);
  const w = WEEKS.find(x => x.id === id) || WEEKS[WEEKS.length - 1];
  for (const a of nav.children) {
    if (a.dataset.id === w.id) a.setAttribute("aria-current", "page");
    else a.removeAttribute("aria-current");
  }
  if (frame.getAttribute("src") !== w.src) frame.setAttribute("src", w.src);
  newtab.href = w.src;
  document.title = "InlayFake · " + w.label;
}
window.addEventListener("hashchange", show);
show();
</script>
</body>
</html>
