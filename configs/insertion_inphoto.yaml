# Task 2 (week 2): full AI-insertion run on the 544 week-1 baseline sources, with the settings of the
# same-class pilot (configs/pilot_inphoto.yaml, run task2_pilot_inphoto: 50 of 50 photos with a
# verified AI object). New work dir, so the week-1 data in data/inlayfake stays untouched.
#
#   class:      one already in the photo's audited week-1 GT (never person); last resort: one of
#               the 10 original categories not in the photo (class_in_photo: false)
#   window:     generator sees 1.2x the box (min 64 px); verification looks at 2.5x
#   verifier:   OWLv2 score >= 0.2 and IoU >= 0.3 or >= 80% inside the box
#   on failure: 3 seeds per box, then up to 3 new boxes, 3 other in-photo classes, 3 outside
#               classes; very last resort: a C5 box anywhere (placement_rule: anywhere)
#   generator:  SDXL (G1) only. The benchmark's scope was reduced to SDXL on 2026-10-17 (PRD §4);
#               SD2 / FLUX are not run.
#
#   python -m inlayfake sample --config configs/insertion_inphoto.yaml
#   python -m inlayfake plan   --config configs/insertion_inphoto.yaml
#   python -m inlayfake insert --config configs/insertion_inphoto.yaml    (overnight, resumable)
#   python -m inlayfake preview --config configs/insertion_inphoto.yaml
inherit: default.yaml
run_name: task2_insertion
generators_enabled: [G1]
sampling:
  # author, 2026-10-17: only the 544 photos of the week-1 baseline (task1_real_baseline), so
  # weeks 1-3 use one photo set; the 56 close-ups week 1 could not plan stay out
  only_sources: data/inlayfake/plans.jsonl
placement:
  class_choice: in_photo
  audit_decisions: data/inlayfake/audit_decisions.csv
  allow_anywhere: true
  occlusion_fill:          # author, 2026-10-18: 137 photos had no C5 box; add one where the C5
    enabled: true          # rules allow it, trying several sizes and covered objects >= 32 px
  free_fill:               # author, 2026-10-18: 70 photos had no C4 box; add one with several
    enabled: true          # sizes, C4 rules (8 px margin) unchanged
  merged:                  # author, 2026-10-18: C4 and C5 merge into one AI condition: a
    enabled: true          # class already in the photo, placed anywhere. Verified C4s are kept
                           # (preferred), else the verified C5 is used, else a box anywhere;
                           # C2/C3 sit at the chosen box
    versions: 27           # author, 2026-10-18: boxes anywhere per photo (6 at first; 12 for the
                           # re-run of 7 dropped photos; 24, then 27, for the last 2, bed and train)
    corner_from: 22        # author, 2026-10-18: boxes 22-27 of the bed and train photos sit in
                           # the bottom-left corner (any overlap; size varies per box)
    avoid_same_class_from: 7   # from box 7 on, a box does not sit on the photo's real object of
                               # the same class (<= 30% of its area; boxes 1-6 unchanged)
    avoid_same_class_until: 18 # author, 2026-10-18: boxes 19-24 (bed and train photos) are
                               # plain anywhere again, any overlap allowed
    c2_attempts: 6         # author, 2026-10-18: 4 C2 shams failed 3 seeds; 3 more seeds, checked
                           # with verify.sham_original_overlap
verify:
  audit_all_conditions: [C4]    # author, 2026-10-18: every C4 is checked by a person; the C4s of
                                # the random 10% draw are flagged for an unbiased error rate
  audit_only_conditions: [C4]   # author, 2026-10-18: only C4 on the sheet (no C2 rows)
  sham_original_overlap: 0.25   # author, 2026-10-18: a sham detection lying >= 25% on a real
                                # object of the class is that object, not a new one
edit:
  window_scale: 1.2
  window_min_px: 64
  max_replans: 3
  max_class_switches: 3
  max_outside_classes: 3
paths:
  work: data/inlayfake_v2
