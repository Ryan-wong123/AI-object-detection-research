# What-if for the box-mode pilot (2026-10-21): smaller minimum box, since Qwen draws realistic,
# tight boxes (half of the rejected ones are under 0.6% of the image). Same work dir: the saved
# Qwen answers are reused, only the rules are re-checked.
inherit: pilot_natural_qwen.yaml
run_name: task2_pilot_natural_qwen_small
placement:
  natural:
    min_box_frac: 0.005
    min_box_side_px: 32
    # A + B (author, 21 Oct): for a class whose boxes all fail, ask again with the taken places and
    # a minimum size; try every class of the photo (stop at the first with a valid spot); then let
    # Qwen pick any listed class (flagged class_in_photo: false). No random fallback.
    retry: true
    classes_per_photo: 99
    stop_when_valid: true
    any_class: true
