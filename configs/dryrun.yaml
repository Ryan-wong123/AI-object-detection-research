# CPU dry run: fake inpainter, 10 sources. Checks the pipeline without a GPU or model downloads.
inherit: default.yaml
sampling:
  n_sources: 10
hardware:
  device: cpu
generators_enabled: [G1]
generators:
  G1: {model_id: fake, resolution: 256, role: seen}
run_name: dryrun
verify:
  model_id: fake
detect:
  detectors: [fake_a, fake_b]
detectors:
  fake_a: {impl: fake}
  fake_b: {impl: fake}
eval:
  bootstrap_resamples: 50
  ap_bootstrap: 5
paths:
  work: data/inlayfake_dryrun
  runs: runs
forensics:
  run_learned: [trufor, univfd]
  models:
    trufor: {model_id: fake}
    univfd: {model_id: fake}
vlm:
  run_models: [fake]
  grounding: {detector: fake_a}
  models:
    fake: {impl: fake}
