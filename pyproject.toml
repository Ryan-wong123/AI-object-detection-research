[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inlayfake"
version = "0.1.0"
description = "InlayFake: benchmark for mixed-origin object understanding"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
]

[project.optional-dependencies]
data = ["pycocotools>=2.0.7", "opencv-python>=4.9", "scipy>=1.11"]
gen = ["diffusers>=0.31", "transformers>=4.46", "accelerate>=1.0", "sentencepiece", "protobuf"]
detect = ["ultralytics>=8.3", "transformers>=4.46", "timm>=1.0"]
forensics = ["opencv-python>=4.9", "scipy>=1.11", "PyWavelets>=1.5", "scikit-learn>=1.4"]
eval = ["pycocotools>=2.0.7", "scikit-learn>=1.4", "pandas>=2.1", "matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.6", "scipy>=1.11", "scikit-learn>=1.4"]
all = ["inlayfake[data,gen,detect,forensics,eval,dev]"]

[project.scripts]
inlayfake = "inlayfake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
